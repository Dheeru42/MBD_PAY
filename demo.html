<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Digital Currency QR Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    text-align:center;
    padding:30px;
}


.container{

    background:white;
    width:450px;
    margin:auto;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px #aaa;

}


input{

    width:90%;
    padding:10px;
    margin:8px;

}


button{

    padding:10px 20px;
    margin:10px;
    background:#333;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;

}


/* QR CARD */

#qrCard{

    display:none;
    margin-top:20px;
    background:white;
    padding:20px;
    border-radius:15px;

}



#qrcode{

    filter:blur(6px);
    opacity:0.3;
    transition:.5s;

}


#qrcode.visible{

    filter:blur(0);
    opacity:1;

}


#qrcode img,
#qrcode canvas{

    margin:auto;

}

</style>

</head>


<body>


<div class="container">


<h2>Digital Currency QR Generator</h2>


<input id="amount"
type="number"
placeholder="Amount">


<input id="serial"
placeholder="Currency Serial Number">

<br>


<button onclick="generateQR()">
Generate QR
</button>




<div id="qrCard">


<div id="qrcode"></div>


<button id="viewBtn" onclick="toggleQR()">
Show QR
</button>


</div>



</div>




<script>


function generateQR(){


let qrBox=document.getElementById("qrcode");


qrBox.innerHTML="";

qrBox.classList.remove("visible");



let currencyData={


currencyName:
"INR",


currencyID:
"CUR-"+Date.now(),


amount:
document.getElementById("amount").value,


encryptedSerial:
document.getElementById("serial").value,


issueTime:
new Date().toISOString(),


status:
"Available",



};




let qrText=JSON.stringify(currencyData);



// Generate QR

new QRCode(qrBox,{

text:qrText,

width:250,

height:250,

correctLevel:QRCode.CorrectLevel.H

});



document.getElementById("qrCard")
.style.display="block";


}




// PIN SHOW/HIDE


function toggleQR(){


let qr=document.getElementById("qrcode");

let btn=document.getElementById("viewBtn");



if(qr.classList.contains("visible")){


qr.classList.remove("visible");

btn.innerHTML="Show QR";


return;

}




let pin=prompt(
"Enter Security PIN"
);



let correctPIN="1234";



if(pin===correctPIN){


qr.classList.add("visible");

btn.innerHTML="Hide QR";


}

else{


alert("Incorrect PIN ❌");


}



}



</script>


</body>
</html>
